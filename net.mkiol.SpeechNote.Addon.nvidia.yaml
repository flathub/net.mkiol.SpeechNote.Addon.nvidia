id: net.mkiol.SpeechNote.Addon.nvidia
runtime: net.mkiol.SpeechNote
runtime-version: beta
sdk: org.kde.Sdk//6.11
build-extension: true
build-options:
  no-debuginfo: true
  prefix: /app/extensions/nvidia
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/cmake
  - /share/pkgconfig
  - "*.a"
modules:
  - name: cuda
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - sh cuda-installer.run --target ./ --noexec
      - rm -rf builds/*.*
      - rm -rf builds/bin builds/cuda_sanitizer_api builds/integration
      - rm -rf builds/nsight_compute builds/nsight_systems builds/cuda_gdb builds/cuda_documentation
      - mkdir -p ${FLATPAK_DEST}/cuda
      - |
        set -e
        for f in $(find . -name "*.a" | grep -v "libcudart_static.a" | grep -P "static\.a|static_nocallback"); do
          echo "removing $f"
          rm -f "$f"
        done
      - |
        set -e
        cd builds
        for f in *; do
          echo "copying $f => ${FLATPAK_DEST}/cuda/"
          if [ -d $f ]; then
            cp -r $f/* ${FLATPAK_DEST}/cuda/
          else
            cp -P $f ${FLATPAK_DEST}/cuda/
          fi
        done
      - |
        set -e
        cd builds/cuda_cupti/extras/CUPTI/lib64
        for f in libcupti.so*; do
          echo "copying $f => ${FLATPAK_DEST}/cuda/lib64/"
          cp -P $f ${FLATPAK_DEST}/cuda/lib64/
        done
      - rm -rf builds
      - rm -rf cuda-installer.run
    build-options:
      strip: true
    cleanup:
      - /cuda/doc
      - /cuda/bin
      - /cuda/extras
      - /cuda/gds*
      - /cuda/include
      - /cuda/libnvvp
      - /cuda/nsight*
      - /cuda/nv*
      - /cuda/pkg-config
      - /cuda/src
      - /cuda/usr
      - /cuda/cublas_version.txt
      - /cuda/LICENSE
      - /cuda/targets/x86_64-linux/lib/cmake
      - /cuda/targets/x86_64-linux/lib/lib64
      - /cuda/targets/x86_64-linux/lib/libOpenCL.so*
      - /cuda/targets/x86_64-linux/lib/libcusolver.so*
      - /cuda/targets/x86_64-linux/lib/libnppif.so*
      - /cuda/targets/x86_64-linux/lib/libcusolverMg.so*
      - /cuda/targets/x86_64-linux/lib/libcuinj64.so*
      - /cuda/targets/x86_64-linux/lib/libaccinj64.so*
      - /cuda/targets/x86_64-linux/include
      - /cuda/targets/x86_64-linux/res
    sources:
      - type: file
        url: https://developer.download.nvidia.com/compute/cuda/13.0.3/local_installers/cuda_13.0.3_580.126.20_linux.run
        sha256: 79c82c6529d2adfc322336f37b2a7a856655cd739b4803d0af7344db5a69638b
        dest-filename: cuda-installer.run

  - name: cuda-extras
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - |
        set -e
        libs=(libcudnn libcudnn_adv libcudnn_cnn libcudnn_engines_precompiled
              libcudnn_engines_runtime_compiled libcudnn_graph libcudnn_heuristic
              libcudnn_ops)
        src_dir="${FLATPAK_DEST}/extra/cudnn/lib"
        trg_dir="${FLATPAK_DEST}/cuda/targets/x86_64-linux/lib"
        mkdir -p "${trg_dir}"
        cd "${trg_dir}"
        for lib in "${libs[@]}"; do
          ln -s "${src_dir}/${lib}.so.9.20.0" ${lib}.so.9.20.0
          ln -s "${src_dir}/${lib}.so.9.20.0" ${lib}.so.9
          ln -s "${src_dir}/${lib}.so.9.20.0" ${lib}.so
        done
      - |
        set -e
        src_dir="${FLATPAK_DEST}/extra/site-packages/nvidia"
        trg_dir="${FLATPAK_DEST}/cuda/targets/x86_64-linux/lib"
        mkdir -p "${trg_dir}"
        cd "${trg_dir}"
        ln -s "${src_dir}/cusparselt/lib/libcusparseLt.so.0" libcusparseLt.so.0
        ln -s "${src_dir}/nccl/lib/libnccl.so.2" libnccl.so.2
        ln -s "${src_dir}/nvshmem/lib/libnvshmem_host.so.3" libnvshmem_host.so.3
        ln -s "${src_dir}/nvshmem/lib/nvshmem_bootstrap_mpi.so.3" nvshmem_bootstrap_mpi.so.3
        ln -s "${src_dir}/nvshmem/lib/nvshmem_bootstrap_pmi2.so.3" nvshmem_bootstrap_pmi2.so.3
        ln -s "${src_dir}/nvshmem/lib/nvshmem_bootstrap_pmi.so.3" nvshmem_bootstrap_pmi.so.3
        ln -s "${src_dir}/nvshmem/lib/nvshmem_bootstrap_pmix.so.3" nvshmem_bootstrap_pmix.so.3
        ln -s "${src_dir}/nvshmem/lib/nvshmem_bootstrap_shmem.so.3" nvshmem_bootstrap_shmem.so.3
        ln -s "${src_dir}/nvshmem/lib/nvshmem_bootstrap_uid.so.3" nvshmem_bootstrap_uid.so.3
        ln -s "${src_dir}/nvshmem/lib/nvshmem_transport_ibdevx.so.3" nvshmem_transport_ibdevx.so.3
        ln -s "${src_dir}/nvshmem/lib/nvshmem_transport_ibgda.so.3" nvshmem_transport_ibgda.so.3
        ln -s "${src_dir}/nvshmem/lib/nvshmem_transport_ibrc.so.3" nvshmem_transport_ibrc.so.3
        ln -s "${src_dir}/nvshmem/lib/nvshmem_transport_libfabric.so.3" nvshmem_transport_libfabric.so.3
        ln -s "${src_dir}/nvshmem/lib/nvshmem_transport_ucx.so.3" nvshmem_transport_ucx.so.3
    sources:
      - type: extra-data
        url: https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-9.20.0.48_cuda13-archive.tar.xz
        filename: cudnn.tar.xz
        sha256: 73f091ee57668dc18e8b1b61811c0ddff2ec0b762efe613e9f27f9ebfd6c20c0
        size: 673041224

  - name: python3-pybind11
    only-arches:
      - x86_64
    buildsystem: simple
    cleanup:
      - /bin
      - /lib/python3.13/site-packages/pybind11*
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "pybind11" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b3/06/c3a23c9a0263b136c519f033a58d4641e73065fefc7754e9667ec206d992/pybind11-3.0.4-py3-none-any.whl
        sha256: 961720ee652da51d531b7b2451a6bd2bc042b0106e6d9baa48ecb7d58034ce63

  # Due to the limitations of the Flathub infrastructure, it is not possible to build CUDA version of ctranslate2 and whisper.cpp.
  # To overcome this problem, pre-compiled binaries from https://github.com/mkiol/dsnote are installed.
  - name: precompiled-binaries
    only-arches:
      - x86_64
    buildsystem: simple
    build-options:
      env:
        PYTHONPATH: /app/extensions/nvidia/lib/python3.13/site-packages:/app/lib/python3.13/site-packages
    cleanup:
      - /bin
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --prefix=${FLATPAK_DEST} --no-build-isolation *.whl
      - install -Dm644 *.so* ${FLATPAK_DEST}/lib/
      - |
        set -e
        cd ${FLATPAK_DEST}/lib
        ln -s libctranslate2.so.4.8.1 libctranslate2.so.4
        ln -s libctranslate2.so.4.8.1 libctranslate2.so
    sources:
      - type: archive
        strip-components: 0
        url: https://github.com/mkiol/dsnote/releases/download/b4.9.1-1/flatpak_binaries_nvidia_1_5.tar.xz
        sha256: 49e6d2f202c4a0daf28fdc97f3cffea3a002d610675b6a6698a10a7995bcb8a2

  - name: python3-torch-cuda
    only-arches:
      - x86_64
    buildsystem: simple
    build-options:
      env:
        PYTHONPATH: /app/extensions/nvidia/lib/python3.13/site-packages:/app/lib/python3.13/site-packages
    build-commands:
      - |
        set -e
        libs=(torch torch-2.12.0.dist-info functorch torchgen
              torchaudio torchaudio-2.11.0.dist-info
              triton triton-3.7.0.dist-info)
        src_dir="${FLATPAK_DEST}/extra/site-packages"
        trg_dir="${FLATPAK_DEST}/lib/python3.13/site-packages"
        mkdir -p "${trg_dir}"
        cd "${trg_dir}"
        for lib in "${libs[@]}"; do
          ln -s "${src_dir}/${lib}" ${lib}
        done
    sources:
      - type: extra-data
        url: https://files.pythonhosted.org/packages/49/8a/94bdecd13f5aaa90d45920b89789d9fe7c6f4af8c3cdd7ce01fcb59908fc/torch-2.12.0-cp313-cp313-manylinux_2_28_x86_64.whl
        sha256: 5d6b560dfa7d56291c07d615c3bb73e8d9943d9b6d87f76cd0d9d570c4797fa6
        filename: torch.whl
        size: 532269288
      - type: extra-data
        url: https://files.pythonhosted.org/packages/30/b1/b7507bb9815d403927c8dd51d4158ed2e11751a92dbc118a044f247b6848/triton-3.7.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: a35d7afe3f3f058e7ec49fcce09794049e0ffc5c59019ac25ec3413741b8c4e7
        filename: triton.whl
        size: 201453566
      - type: extra-data
        url: https://files.pythonhosted.org/packages/4f/98/be13fe35d9aa5c26381c0e453c828a789d15c007f8f7d08c95341d19974d/torchaudio-2.11.0-cp313-cp313-manylinux_2_28_x86_64.whl
        sha256: 1c1101c1243ef0e4063ec63298977e2d3655c15cf88d9eb0a1bd4fe2db9f47ea
        filename: torchaudio.whl
        size: 1771992
      - type: extra-data
        url: https://files.pythonhosted.org/packages/34/7d/2661f2fb3ac4302f3a246f5fc030213ac60c1fe0bce84f9783dbd831dbb7/nvidia_cusparselt_cu13-0.8.1-py3-none-manylinux2014_x86_64.whl
        sha256: 786ce87568c303fadb5afcc7102d454cd3040d75f6f8626f5db460d1871f4dd0
        filename: nvidia_cusparselt.whl
        size: 170148586
      - type: extra-data
        url: https://files.pythonhosted.org/packages/67/f4/58e4e91b6919367c7aafb8e36fce9aad1a3047e536bf7e2fd560927d3a4c/nvidia_nccl_cu13-2.29.7-py3-none-manylinux_2_18_x86_64.whl
        sha256: edd81538446786ec3b73972543e53bb43bcaf0bfc8ef76cb679fcc390ffe136d
        filename: nvidia_nccl.whl
        size: 205976000
      - type: extra-data
        url: https://files.pythonhosted.org/packages/3c/35/a9bf80a609e74e3b000fef598933235c908fcefcef9026042b8e6dfde2a9/nvidia_nvshmem_cu13-3.4.5-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: 290f0a2ee94c9f3687a02502f3b9299a9f9fe826e6d0287ee18482e78d495b80
        filename: nvidia_nvshmem.whl
        size: 60412546

  - name: apply-extra-script
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
    sources:
      - type: script
        dest-filename: apply_extra
        commands:
          - |
            echo
            echo "Files to install:"
            ls
          - |
            set -e
            extra_dir="/app/extra"
            trg_dir="${extra_dir}/cudnn"
            echo "Installing cuDNN..."
            mkdir -p "${trg_dir}"
            tar -xf cudnn.tar.xz --no-same-owner --no-same-permissions --strip-components=1 --directory="${trg_dir}"

            # cleanup
            rm -rf cudnn.tar.xz
            for f in $(find "${trg_dir}" -name "*.a"); do
              rm -f "$f"
            done
            for f in $(find "${trg_dir}" -type l); do
              rm -f "$f"
            done
          - |
            set -e
            extra_dir="/app/extra"
            trg_dir="${extra_dir}/site-packages"
            echo "Installing PyTorch..."
            libs=(torch triton torchaudio nvidia_cusparselt nvidia_nccl nvidia_nvshmem)
            mkdir -p "${trg_dir}"
            cd "${trg_dir}"
            for lib in "${libs[@]}"; do
              echo "Installing ${lib}.whl..."
              unzip -q ../${lib}.whl
              rm -rf ../${lib}.whl
            done

            # cleanup
            rm -rf torch/include
            for f in $(find . -name "*.a"); do
              rm -f "$f"
            done

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        path: net.mkiol.SpeechNote.Addon.nvidia.metainfo.xml
